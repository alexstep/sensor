<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
<body>

<main class="scene">
  <div class="card">
    <div class="card-top">
      <div class="bank-name">bank of genovia</div>
      <div class="card-logo">&#10049;</div>
    </div>
    <div class="card-number">0210 4220 1150 4222</div>
    <div class="card-bottom">
      <div class="card-field">
        <div class="card-label">card holder</div>
        <div class="card-value">Alex Step</div>
      </div>
      <div class="card-field">
        <div class="card-label">expires</div>
        <div class="card-value">02/28</div>
      </div>
    </div>
  </div>
</main>

<button class="permission-btn" id="permission">tap to enable gyroscope</button>

<script defer>
  const GAMMA_RANGE = 70
  const BETA_OFFSET = 45
  const BETA_RANGE = 45

  window.addEventListener("deviceorientation", throttle((e) => {
    if (e.beta == null || e.gamma == null) return
    if (e.beta > 90) return

    const gammaNorm = clamp(e.gamma / GAMMA_RANGE)
    const betaNorm = clamp((e.beta - BETA_OFFSET) / BETA_RANGE)

    const gammaPercent = ((gammaNorm + 1) * 50).toFixed(2)
    const betaPercent = ((betaNorm + 1) * 50).toFixed(2)

    document.documentElement.style.setProperty("--gyro-gamma", gammaPercent)
    document.documentElement.style.setProperty("--gyro-beta", betaPercent)
  }, 50))

  document.querySelector("#permission").addEventListener("click", async () => {
    if (typeof DeviceOrientationEvent?.requestPermission !== "function") return
    const result = await DeviceOrientationEvent.requestPermission()
    console.log(result)
  })

  function clamp(v, min = -1, max = 1) { return Math.min(max, Math.max(min, v)) }
  function throttle(fn, ms) {
    let last = 0
    return (...args) => {
      const now = performance.now()
      if (now - last < ms) return
      last = now
      fn(...args)
    }
  }
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
  }

  :root {
    --gyro-gamma: 50;
    --gyro-beta: 50;
    --g-offset: calc(var(--gyro-gamma) - 50);
    --b-offset: calc(var(--gyro-beta) - 50);

    --rotate-speed: 0.5deg;
    --shadow-speed: 0.4px;
    --shine-speed: 2%;
  }

  .scene {
    perspective: 75rem;
    padding: 60px;
  }

  .card {
    position: relative;
    width: 340px;
    height: 210px;
    padding: 28px 24px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;

    background-color: #111;
    background-image:
      radial-gradient(circle at 20% 80%, #ffffff06 35%, transparent 36%),
      radial-gradient(circle at 80% 20%, #ffffff06 35%, transparent 36%);
    background-size: 4.95em 4.95em;

    transform-style: preserve-3d;
    will-change: transform, filter;
    transform:
      rotateY(calc(var(--g-offset) * var(--rotate-speed)))
      rotateX(calc(var(--b-offset) * var(--rotate-speed) * -1));

    filter:
      drop-shadow(
        calc(var(--g-offset) * var(--shadow-speed) * -1)
        calc(10px + var(--b-offset) * var(--shadow-speed) * -1)
        20px
        rgba(0,0,0,0.5)
      );

    transition: transform 120ms linear, filter 200ms ease-out;

    outline: 0.5px solid #fff1;
    outline-offset: -1px;

    text-transform: uppercase;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(
      ellipse 90% 90%
        at calc(50% - var(--g-offset) * var(--shine-speed))
           calc(30% - var(--b-offset) * var(--shine-speed)),
      rgba(255,255,255,0.15) 0%,
      rgba(255,255,255,0.04) 80%,
      transparent 100%
    );
    transition: background 120ms linear;
  }

  .card::after {
    content: "";
    position: absolute;
    right: 0;
    top: 15%;
    width: 1px;
    height: 70%;
    pointer-events: none;
    z-index: 1;
    will-change: transform;
    transform: translateY(calc(var(--b-offset) * -2%));
    background: linear-gradient(
      to top,
      transparent 5%,
      #fff1 35%,
      #fff8 50%,
      #fff1 65%,
      transparent 95%
    );
    opacity: 0.6;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .bank-name {
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 2px;
  }

  .card-logo {
    font-size: 36px;
    opacity: 0.12;
    line-height: 1;
  }

  .card-number {
    font-size: 18px;
    letter-spacing: 3px;
    opacity: 0.4;
  }

  .card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .card-label {
    font-size: 9px;
    opacity: 0.25;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .card-value {
    font-size: 14px;
    letter-spacing: 1px;
  }

  .permission-btn {
    margin-top: 40px;
    padding: 10px 24px;
    border: 1px solid #fff3;
    border-radius: 8px;
    background: transparent;
    color: #fff6;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 200ms, color 200ms;
  }
  .permission-btn:active {
    border-color: #fff6;
    color: #fffa;
  }
</style>

</body>
</html>
